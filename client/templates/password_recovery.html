<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
  <title>{{ 'Reset Password' if resetting else 'Forgot Password' }} | AquaCulture</title>
  <link rel="stylesheet" href="{{ url_for('static',filename='auth/recovery.css') }}">
  <script src="{{ url_for('static',filename='auth/recovery.js') }}" defer></script>
</head>
<body data-mode="{{ 'reset' if resetting else 'forgot' }}">
  <main><a class="brand" href="/">AquaCulture</a>
    <h1>{{ 'Reset Password' if resetting else 'Forgot Password' }}</h1>
    <p>{{ 'Choose a new Admin password of 12–128 characters.' if resetting else 'Enter the recovery email associated with the Admin account.' }}</p>
    <form id="recoveryForm" autocomplete="off">
      {% if resetting %}
      <label for="newPassword">New password</label>
      <div class="password-row"><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="button" data-eye="newPassword" aria-label="Show new password" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <label for="confirmPassword">Confirm new password</label>
      <div class="password-row"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="button" data-eye="confirmPassword" aria-label="Show confirmation password" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      {% else %}
      <label for="recoveryEmail">Admin recovery email</label><input id="recoveryEmail" type="email" autocomplete="email" maxlength="254" required>
      {% endif %}
      <button id="submitRecovery" class="primary" type="submit">{{ 'Reset Password' if resetting else 'Send Reset Link' }}</button>
    </form>
    <p id="recoveryMessage" role="status" aria-live="polite"></p><a href="/">Back to AquaCulture</a>
  </main>
</body></html>
